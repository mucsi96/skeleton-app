logger:
  enable: true
  level: info
  format: compact
server:
  binding: <%= get_env(name="BINDING", default="127.0.0.1") %>
  port: <%= get_env(name="PORT", default="8053") %>
  host: http://localhost
  middlewares:
    etag:
      enable: false
    fallback:
      enable: false
    secure_headers:
      enable: true
      preset: empty
      overrides:
        Cache-Control: no-store
        X-Content-Type-Options: nosniff
workers:
  mode: BackgroundAsync
database:
  uri: <%= get_env(name="DATABASE_URL") %>
  enable_logging: false
  min_connections: 1
  max_connections: 10
  connect_timeout: 30000
  idle_timeout: 300000
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false
  run_on_start: CREATE SCHEMA IF NOT EXISTS hello
settings:
  oidc:
    issuer: <%= get_env(name="OIDC_ISSUER") %>
    audience: <%= get_env(name="API_CLIENT_ID") %>
  anthropic:
    base_url: <%= get_env(name="ANTHROPIC_BASE_URL") %>
    api_key: <%= get_env(name="ANTHROPIC_API_KEY") %>
    model: claude-sonnet-4-6
    max_tokens: 1024
    timeout_seconds: 30
