logger:
  enable: true
  level: info
  format: json
server:
  binding: 0.0.0.0
  port: <%= get_env(name="PORT", default="8080") %>
  host: http://localhost
  middlewares:
    etag:
      enable: false
    fallback:
      enable: false
    secure_headers:
      enable: true
      preset: empty
      overrides:
        Cache-Control: no-store
        X-Content-Type-Options: nosniff
workers:
  mode: BackgroundAsync
database:
  # Supplied by workload identity before connecting.
  uri: ""
  enable_logging: false
  min_connections: 1
  max_connections: 10
  connect_timeout: 30000
  idle_timeout: 300000
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false
  run_on_start: CREATE SCHEMA IF NOT EXISTS hello
settings:
  oidc:
    issuer: ""
    audience: ""
  anthropic:
    base_url: https://api.anthropic.com
    api_key: ""
    model: claude-sonnet-4-6
    max_tokens: 1024
    timeout_seconds: 30
