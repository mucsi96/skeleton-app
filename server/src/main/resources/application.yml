spring:
  datasource:
    url: ${db-url}
    username: ${db-username}
    password: ${db-password}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS hello
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show-sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: hello
    liquibase-schema: hello
  cloud:
    azure:
      keyvault:
        secret:
          property-sources:
            - endpoint: ${AZURE_KEYVAULT_ENDPOINT}
              enabled: true
  mail:
    host: ${mail-host:}
    port: ${mail-port:587}
    username: ${mail-username:}
    password: ${mail-password:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  ai:
    anthropic:
      api-key: ${claude-api-key}
      chat:
        options:
          model: claude-sonnet-4-6
app:
  base-url: ${app-base-url}
  allowed-emails: ${allowed-emails}
  email:
    provider: smtp
    from: ${mail-from:no-reply@skeleton-app}
server:
  forward-headers-strategy: framework
  servlet:
    context-path: /api
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
management:
  server:
    port: ${SPRING_ACTUATOR_PORT}
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
