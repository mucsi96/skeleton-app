databaseChangeLog:
  - changeSet:
      id: 1-create-hello-schema
      author: mucsi96
      changes:
        - sql:
            sql: CREATE SCHEMA IF NOT EXISTS hello
  - changeSet:
      id: 2-create-greetings-table
      author: mucsi96
      changes:
        - createTable:
            schemaName: hello
            tableName: greetings
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: message
                  type: text
                  constraints:
                    nullable: false
  - changeSet:
      id: 3-seed-initial-greeting
      author: mucsi96
      changes:
        - insert:
            schemaName: hello
            tableName: greetings
            columns:
              - column:
                  name: name
                  value: Igor
              - column:
                  name: message
                  value: Welcome to the skeleton app!
