spring:
  cloud:
    azure:
      keyvault:
        secret:
          property-sources:
            - enabled: false
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      base-url: ${ANTHROPIC_BASE_URL}
app:
  base-url: http://localhost:8150
  allowed-emails:
    - test-user@example.com
  email:
    provider: mock
    mock-server-uri: ${MOCK_EMAIL_SERVER_URI}
server:
  servlet:
    session:
      cookie:
        secure: false
