apiVersion: v1
kind: Pod
metadata:
  name: skeleton-app-test
spec:
  containers:
    - name: traefik
      image: docker.io/library/traefik:v3.6
      ports:
        - containerPort: 80
          hostPort: 8150
        - containerPort: 8081
          hostPort: 8151
      volumeMounts:
        - name: traefik-config
          mountPath: /etc/traefik/traefik.yaml
          readOnly: true
        - name: traefik-routes
          mountPath: /etc/traefik/routes.yaml
          readOnly: true
      livenessProbe:
        exec:
          command: ["traefik", "healthcheck", "--ping"]
        initialDelaySeconds: 2
        periodSeconds: 2
        failureThreshold: 5

    - name: db
      image: docker.io/library/postgres:17.5-bullseye
      ports:
        - containerPort: 5432
          hostPort: 5451
      env:
        - name: POSTGRES_DB
          value: test
        - name: POSTGRES_PASSWORD
          value: postgres
        - name: POSTGRES_USER
          value: postgres
      livenessProbe:
        exec:
          command: ["pg_isready", "-U", "postgres"]
        initialDelaySeconds: 5
        periodSeconds: 10
        failureThreshold: 5

    - name: mock-anthropic
      image: localhost/skeleton-app-mock-anthropic:test
      ports:
        - containerPort: 3050
          hostPort: 3050
      env:
        - name: PORT
          value: "3050"
      livenessProbe:
        httpGet:
          path: /health
          port: 3050
        initialDelaySeconds: 2
        periodSeconds: 2
        failureThreshold: 5

    - name: mock-oauth2
      image: ghcr.io/mucsi96/mock-oidc-provider:14@sha256:51462e8a071c5401a7a5270d37cd75f11fa5253786abaa4b5a6f656d79325a66
      ports:
        - containerPort: 8050
          hostPort: 8050
      env:
        - name: PORT
          value: "8050"
        - name: ISSUER_ID
          value: default
        - name: SUB
          value: test-user
        - name: OID
          value: 00000000-0000-0000-0000-000000000001
        - name: NAME
          value: Test User
        - name: PREFERRED_USERNAME
          value: test-user@example.com
        - name: ROLES
          value: readGreetings,createGreeting
        - name: SCP
          value: api-access
        - name: AUD
          value: mock-api-client-id
        - name: FIXTURE_CONFIG_FILE
          value: /config/oidc-clients.json
      volumeMounts:
        - name: auth-config
          mountPath: /config
          readOnly: true
      livenessProbe:
        httpGet:
          path: /health
          port: 8050
        initialDelaySeconds: 2
        periodSeconds: 2
        failureThreshold: 5

    - name: server
      image: localhost/skeleton-app-server:test
      env:
        - name: SERVER_PORT
          value: "8054"
        - name: BROWSER_ORIGIN
          value: http://localhost:8150
        - name: SPRING_ACTUATOR_PORT
          value: "8152"
        - name: DB_URL
          value: jdbc:postgresql://localhost:5432/test
        - name: DB_USERNAME
          value: postgres
        - name: DB_PASSWORD
          value: postgres
        - name: ANTHROPIC_API_KEY
          value: mock-anthropic-key
        - name: ANTHROPIC_BASE_URL
          value: http://localhost:3050
        - name: MOCK_OAUTH2_SERVER_URI
          value: http://localhost:8050
      livenessProbe:
        httpGet:
          path: /actuator/health/readiness
          port: 8152
        # The native executable is serving within a second of the container
        # starting, so there is nothing to wait for before the first probe. The
        # window stays generous because readiness still waits for the db
        # container and the Liquibase migration.
        initialDelaySeconds: 2
        periodSeconds: 2
        failureThreshold: 30

    - name: redis
      image: docker.io/library/redis:8.2-alpine
      args: [redis-server, --save, "", --appendonly, "no"]
      livenessProbe:
        exec:
          command: [redis-cli, ping]
    - name: oauth2-proxy
      # Podman executes HTTP probes inside the container; Alpine supplies wget.
      image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.2-alpine
      args: [--config=/config/oauth2-proxy.cfg, --alpha-config=/config/oauth2-proxy.yaml]
      volumeMounts:
        - name: auth-config
          mountPath: /config
          readOnly: true
      livenessProbe:
        exec:
          command: [wget, -q, -O, /dev/null, http://127.0.0.1:4180/ping]
    - name: client
      image: localhost/skeleton-app-client:test
      livenessProbe:
        httpGet:
          path: /
          port: 8000
        initialDelaySeconds: 5
        periodSeconds: 2
        failureThreshold: 10

  volumes:
    - name: auth-config
      hostPath:
        path: test
        type: Directory
    - name: traefik-config
      hostPath:
        path: test/traefik.yaml
        type: File
    - name: traefik-routes
      hostPath:
        path: test/traefik-routes.yaml
        type: File
