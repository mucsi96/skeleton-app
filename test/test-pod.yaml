apiVersion: v1
kind: Pod
metadata:
  name: skeleton-app-test
spec:
  containers:
    - name: traefik
      image: docker.io/library/traefik:v3.6
      ports:
        - containerPort: 80
          hostPort: 8150
        - containerPort: 8081
          hostPort: 8151
      volumeMounts:
        - name: traefik-config
          mountPath: /etc/traefik/traefik.yaml
          readOnly: true
        - name: traefik-routes
          mountPath: /etc/traefik/routes.yaml
          readOnly: true
      livenessProbe:
        exec:
          command: ["traefik", "healthcheck", "--ping"]
        initialDelaySeconds: 2
        periodSeconds: 2
        failureThreshold: 5

    - name: db
      image: docker.io/library/postgres:17.5-bullseye
      ports:
        - containerPort: 5432
          hostPort: 5451
      env:
        - name: POSTGRES_DB
          value: test
        - name: POSTGRES_PASSWORD
          value: postgres
        - name: POSTGRES_USER
          value: postgres
      livenessProbe:
        exec:
          command: ["pg_isready", "-U", "postgres"]
        initialDelaySeconds: 5
        periodSeconds: 10
        failureThreshold: 5

    - name: mock-anthropic
      image: localhost/skeleton-app-mock-anthropic:test
      ports:
        - containerPort: 3050
          hostPort: 3050
      env:
        - name: PORT
          value: "3050"
      livenessProbe:
        httpGet:
          path: /health
          port: 3050
        initialDelaySeconds: 2
        periodSeconds: 2
        failureThreshold: 5

    - name: mock-email
      image: localhost/skeleton-app-mock-email:test
      ports:
        - containerPort: 3055
          hostPort: 3055
      env:
        - name: PORT
          value: "3055"
      livenessProbe:
        httpGet:
          path: /health
          port: 3055
        initialDelaySeconds: 2
        periodSeconds: 2
        failureThreshold: 5

    - name: server
      image: localhost/skeleton-app-server:test
      env:
        - name: SERVER_PORT
          value: "8054"
        - name: SPRING_ACTUATOR_PORT
          value: "8152"
        - name: SPRING_PROFILES_ACTIVE
          value: test
        - name: DB_URL
          value: jdbc:postgresql://localhost:5432/test
        - name: DB_USERNAME
          value: postgres
        - name: DB_PASSWORD
          value: postgres
        - name: ANTHROPIC_API_KEY
          value: mock-anthropic-key
        - name: ANTHROPIC_BASE_URL
          value: http://localhost:3050
        - name: MOCK_EMAIL_SERVER_URI
          value: http://localhost:3055
      livenessProbe:
        httpGet:
          path: /actuator/health/readiness
          port: 8152
        initialDelaySeconds: 16
        periodSeconds: 2
        failureThreshold: 10

    - name: client
      image: localhost/skeleton-app-client:test
      livenessProbe:
        httpGet:
          path: /
          port: 8000
        initialDelaySeconds: 5
        periodSeconds: 2
        failureThreshold: 10

  volumes:
    - name: traefik-config
      hostPath:
        path: test/traefik.yaml
        type: File
    - name: traefik-routes
      hostPath:
        path: test/traefik-routes.yaml
        type: File
