<mat-card class="login-card">
  <mat-card-content>
    @if (linkSent()) {
    <h1>Check your inbox</h1>
    <p>
      If <strong>{{ email() }}</strong> is allowed, a sign-in link has been sent.
      Open it to continue.
    </p>
    } @else {
    <h1>Sign in</h1>
    <p>Enter your email and we'll send you a sign-in link.</p>
    <form (ngSubmit)="sendLink()">
      <mat-form-field appearance="outline" class="email-field">
        <mat-label>Email</mat-label>
        <input
          matInput
          type="email"
          name="email"
          autocomplete="email"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          required
        />
      </mat-form-field>
      <button
        mat-flat-button
        type="submit"
        [disabled]="submitting() || !email().trim()"
      >
        Send magic link
      </button>
    </form>
    }
  </mat-card-content>
</mat-card>
