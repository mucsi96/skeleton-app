<div class="page-toolbar">
  <button
    mat-icon-button
    aria-label="Refresh greeting"
    (click)="greeting.reload()"
    [disabled]="greeting.isLoading()"
  >
    <mat-icon>refresh</mat-icon>
  </button>
</div>

@if (greeting.isLoading()) {
<bt-bar-loader class="page-loading" label="Loading greeting" />
} @else {
<h1>Welcome, {{ greeting.value()?.name }}</h1>
<p>{{ greeting.value()?.message }}</p>
<mat-card>
  <mat-card-content>
    <p class="ai-greeting">{{ greeting.value()?.aiGreeting }}</p>
  </mat-card-content>
</mat-card>
}
